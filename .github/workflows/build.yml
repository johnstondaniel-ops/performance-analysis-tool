name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-mac:
    strategy:
      matrix:
        include:
          - os: macos-13
            arch: x64
            arch_flag: --x64
          - os: macos-latest
            arch: arm64
            arch_flag: --arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build Vite
        run: npm run build

      - name: Build Electron DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --mac ${{ matrix.arch_flag }}
